name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.28.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: groomingspa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d groomingspa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/groomingspa_test
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdefghijklmnop
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdefghijklmnop
      MAIL_HOST: localhost
      MAIL_PORT: "1025"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.28.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm test:coverage

  evidencia-individual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Commits de test por autor esta semana
        run: |
          echo "### Commits de test por autor desde el lunes" >> "$GITHUB_STEP_SUMMARY"
          git shortlog -sn --since="last Monday" HEAD -- '*tests/*' '*__tests__/*' '*.test.*' '*e2e/*' >> "$GITHUB_STEP_SUMMARY"